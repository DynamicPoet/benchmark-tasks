<text x="8.00" y="18.00" font-size="3.5" font-family="sans-serif">Left edge of the sheet: parallel to the centre line between the arms, 5.5 cm to its right.</text>
<text x="8.00" y="24.00" font-size="3.5" font-family="sans-serif">Dashed square: the 20 x 20 cm spill patch; its near (bottom) edge is 25 cm in front of</text>
<text x="8.00" y="30.00" font-size="3.5" font-family="sans-serif">the arms' base line (the line through both arm mounts).</text>
<text x="8.00" y="36.00" font-size="3.5" font-family="sans-serif">Prick each ring centre through onto the table with a pencil point, then remove the sheet.</text>
