<text x="12" y="231" font-size="3.6">3 Push each stem 6 cm into its hole (measured along the stem from the soil), leaning along its arrow.</text>
<text x="12" y="240" font-size="3.6">Angle guides: cut out; stand one upright beside the stem, bottom edge on the soil, corner at the stem's base.</text>
